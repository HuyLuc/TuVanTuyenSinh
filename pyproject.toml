[project]
name = "tuyensinh"
version = "0.1.0"
description = "Trợ lý AI tư vấn tuyển sinh đại học (RAG + tra cứu số liệu)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.33",
    "tenacity>=9.0",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gradio>=5.0",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
# Chỉ cần khi deploy lên Hugging Face Spaces (đẩy log lên Dataset riêng tư)
hf = ["huggingface-hub>=0.25"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuyensinh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
